name: Release

# Push a tag like `v0.1.0` (matching package.json "version") to publish:
#   - a GitHub release with the .vsix attached;
#   - the VS Code Marketplace — used by VS Code. Signs in with a Microsoft Entra
#     app registration through GitHub OIDC (repository variables AZURE_CLIENT_ID,
#     AZURE_TENANT_ID; AZURE_SUBSCRIPTION_ID only for a managed identity), no stored secret. The
#     secret VSCE_PAT is used instead when the variables are not set (Azure DevOps
#     global PATs stop working on December 1, 2026);
#   - Open VSX (secret OVSX_PAT) — used by Cursor, VSCodium and others.
# A marketplace without credentials is skipped. See docs/RELEASING.md.
#
# Run the workflow by hand (Actions → Release → Run workflow) to:
#   - publish-open-vsx: publish the .vsix of an existing GitHub release to Open
#     VSX (a release made before OVSX_PAT existed, or a failed upload);
#   - marketplace-identity: print the Marketplace id of the Entra identity,
#     which must be added to the publisher (one-time setup).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options:
          - publish-open-vsx
          - marketplace-identity
        default: publish-open-vsx
      tag:
        description: 'publish-open-vsx: the release to publish, e.g. v0.2.2 (empty = the latest release)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The Entra federated credential trusts this environment (subject repo:<owner>/<repo>:environment:vscode-marketplace).
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Tag matches package.json version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: xvfb-run -a npm run test:e2e

      - name: Package
        run: |
          npm run package
          echo "VSIX=$(ls *.vsix)" >> "$GITHUB_ENV"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$VSIX" --title "$GITHUB_REF_NAME" --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."

      - name: Sign in to Microsoft Entra ID
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          USE_ENTRA: ${{ vars.AZURE_CLIENT_ID != '' }}
        if: vars.AZURE_CLIENT_ID != '' || env.VSCE_PAT != ''
        run: |
          if [ "$USE_ENTRA" = "true" ]; then
            npx vsce publish --packagePath "$VSIX" --azure-credential
          else
            npx vsce publish --packagePath "$VSIX" --pat "$VSCE_PAT"
          fi

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        run: npx ovsx publish "$VSIX" --pat "$OVSX_PAT"

  # Publishes the .vsix of an existing GitHub release to Open VSX.
  publish-open-vsx:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'publish-open-vsx'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download the .vsix of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern '*.vsix'
          echo "VSIX=$(ls *.vsix)" >> "$GITHUB_ENV"
          echo "Publishing $(ls *.vsix) from release $TAG"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "The OVSX_PAT secret is not set (see docs/RELEASING.md)." >&2
            exit 1
          fi
          npx --yes ovsx@1.3.0 publish "$VSIX" --pat "$OVSX_PAT"

  # One-time setup: the id to add as a Contributor of the Marketplace publisher.
  marketplace-identity:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'marketplace-identity'
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Marketplace id of the identity
        run: |
          ID="$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)"
          {
            echo "### Marketplace identity"
            echo
            echo "Add \`$ID\` as a **Contributor** of the publisher: https://marketplace.visualstudio.com/manage → publisher → Members."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Marketplace id: $ID"
