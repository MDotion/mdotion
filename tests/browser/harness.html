<!DOCTYPE html>
<!--
  Runs the built webview in a normal browser with a fake VS Code host, to work on
  the UI without launching an Extension Development Host:

    npm run build:webview && npm run harness   →  http://localhost:5178/tests/browser/harness.html

  ?theme=dark switches the VS Code theme class, ?screenshot hides the host panel, ?outline opens the outline. The right panel shows the Markdown
  the extension would write to disk. The file as it was on load plays the last commit for Changes; ?baseline=other.md
  uses another fixture instead, ?baseline=untracked a new file and ?baseline=none a file outside Git.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDotion harness</title>
    <script>
      // Always the latest build: the dev server sends no cache headers.
      document.write(`<link rel="stylesheet" href="/dist/webview/assets/index.css?${Date.now()}" />`);
    </script>
    <style>
      body { display: grid; grid-template-columns: 1fr 420px; grid-template-rows: 100vh; height: 100vh; overflow: hidden; }
      /* The editor scrolls in a box exactly as tall as the window, like the VS Code webview. */
      #root, #host { min-height: 0; }
      #root { overflow: auto; }
      #host { display: flex; flex-direction: column; border-left: 1px solid #8884; font: 12px/1.5 Menlo, monospace; }
      #host header { display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid #8884; }
      #host pre { flex: 1; margin: 0; padding: 8px; overflow: auto; white-space: pre-wrap; }
      #log { max-height: 120px; overflow: auto; padding: 4px 8px; border-top: 1px solid #8884; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <aside id="host">
      <header>
        <strong>Host document</strong> <span id="version"></span>
        <button id="external" type="button">External edit</button>
      </header>
      <pre id="source"></pre>
      <div id="log"></div>
    </aside>
    <script>
      const params = new URLSearchParams(location.search);
      document.body.classList.add(params.get('theme') === 'dark' ? 'vscode-dark' : 'vscode-light');
      if (params.has('screenshot')) {
        // README screenshots: editor only, without the fake host panel.
        document.body.style.gridTemplateColumns = '1fr';
        document.getElementById('host').style.display = 'none';
      }
      const host = {
        text: '',
        version: 1,
        lastSent: 1,
        theme: params.get('mdotionTheme') || 'auto',
        settings: { fullWidth: false, smallText: false, font: 'default', outline: params.has('outline') },
        // Like the workspace state of the real host: survives a reload of the page.
        viewState: JSON.parse(sessionStorage.getItem('mdotion-view-state') || '{"folded":[],"tableWidths":{}}'),
        render() {
          document.getElementById('source').textContent = this.text;
          document.getElementById('version').textContent = 'v' + this.version;
        },
        log(line) {
          const el = document.getElementById('log');
          el.textContent = line + '\n' + el.textContent;
          console.log('[host]', line);
        },
        send(message) {
          window.postMessage(message, '*');
        },
      };
      window.__host = host;
      window.acquireVsCodeApi = () => ({
        postMessage(message) {
          host.log('← ' + message.type + (message.href ? ' ' + message.href : ''));
          if (message.type === 'ready') {
            host.lastSent = host.version;
            host.send({
              type: 'init',
              text: host.text,
              version: host.version,
              fileName: params.get('file') || 'notion.md',
              documentDirUri: location.origin + '/tests/fixtures/',
              settings: host.settings,
              theme: host.theme,
              viewState: host.viewState,
            });
          } else if (message.type === 'readClipboard') {
            navigator.clipboard.readText().then(
              (text) => host.send({ type: 'clipboardText', text }),
              () => host.log('clipboard read refused'),
            );
          } else if (message.type === 'saveSettings') {
            host.settings = message.settings;
          } else if (message.type === 'saveViewState') {
            host.viewState = message.viewState;
            sessionStorage.setItem('mdotion-view-state', JSON.stringify(message.viewState));
          } else if (message.type === 'setTheme') {
            // Like the real host: the setting is stored, then broadcast back.
            host.theme = message.theme;
            host.send({ type: 'theme', theme: message.theme });
          } else if (message.type === 'requestBaseline') {
            const choice = params.get('baseline');
            const baseline =
              choice === 'none' || choice === 'untracked'
                ? { status: choice }
                : { status: 'ok', text: host.committed, commit: 'a1b2c3d', committedAt: Date.now() - 2 * 3600 * 1000 };
            setTimeout(() => host.send({ type: 'baseline', baseline }), 50);
          } else if (message.type === 'copyMarkdown') {
            navigator.clipboard.writeText(host.text).catch(() => host.log('clipboard write refused'));
          } else if (message.type === 'edit') {
            if (message.baseVersion !== host.lastSent) {
              host.send({ type: 'conflict', rejectedText: message.text });
            } else {
              host.text = message.text;
              host.version += 1;
            }
          }
          host.render();
        },
        getState() {},
        setState() {},
      });
      document.getElementById('external').addEventListener('click', () => {
        host.text = host.text.replace(/^# (.*)$/m, (_, title) => `# ${title} (edited outside)`);
        host.version += 1;
        host.lastSent = host.version;
        host.render();
        host.send({ type: 'update', text: host.text, version: host.version });
      });
      const baselineFile = params.get('baseline');
      Promise.all([
        fetch('/tests/fixtures/' + (params.get('file') || 'notion.md')).then((response) => response.text()),
        baselineFile && /\.md$/.test(baselineFile) ? fetch('/tests/fixtures/' + baselineFile).then((response) => response.text()) : null,
      ])
        .then(([text, committed]) => {
          host.text = text;
          host.committed = committed ?? text;
          host.render();
          const script = document.createElement('script');
          script.src = `/dist/webview/assets/index.js?${Date.now()}`;
          document.body.appendChild(script);
        });
    </script>
  </body>
</html>
